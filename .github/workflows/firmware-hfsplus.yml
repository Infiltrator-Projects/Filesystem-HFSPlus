# SPDX-License-Identifier: GPL-3.0-or-later
# No release / live system modification before real-media and OVMF tests.
name: Qualify HFSPLUS native freestanding Common V2 ELF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and ELF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git libssl-dev hfsprogs hfsplus
      - name: Build exact source-owned HFSPLUS read-only firmware binary
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DHFSPLUS_REAL_MEDIA_TESTS=ON
          cmake --build build --parallel 2
      - name: Exercise real-media V2 HFS+ namespace and corruption cases
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 ctest --test-dir build --output-on-failure -V
      - name: Audit freestanding ELF imports and embedded SO
        shell: bash
        run: |
          set -euo pipefail
          test -s build/firmware/HFSPLUS.so
          ! readelf -dW build/firmware/HFSPLUS.so | grep '(NEEDED)'
          ! nm -u build/firmware/HFSPLUS.so | grep .
          nm -D --defined-only build/firmware/HFSPLUS.so |
             grep -F infiltrator_filesystem_api_v2
          test -s build/HFSPLUS.so
          readelf -SW build/HFSPLUS.so | grep -F .infiltrator_boot
      - name: Verify actual canonical SO using production BOOT 0.1.77
        shell: bash
        run: |
          set -euo pipefail
          boot=infiltrator-boot_0.1.77_amd64.deb
          curl -fsSL --retry 3 \
            "https://github.com/Infiltrator-Projects/Boot/releases/download/v0.1.77/$boot" \
            -o "$RUNNER_TEMP/$boot"
          printf '%s  %s\n' \
            c70fd0bec2d6a2728e9ceddb4149c58ef63955ecfe42184a18ea960ede6a1c5c \
            "$RUNNER_TEMP/$boot" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$boot" "$RUNNER_TEMP/boot"
          validator="$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/validate-module"
          if [[ ! -x "$validator" ]]; then
            echo "Production BOOT 0.1.77 no longer supplies validate-module; HFSPLUS qualification blocked" >&2
            exit 1
          fi
          "$validator" build/firmware/HFSPLUS.so
          DESTDIR="$RUNNER_TEMP/install" cmake --install build
          module="$RUNNER_TEMP/install/System/Filesystems/HFSPLUS.so"
          test -s "$module"
          cmp build/HFSPLUS.so "$module"
          "$validator" "$module"
          echo HFSPLUS_COMMON_V2_FREESTANDING_ELF_AND_HOSTED_MODULE_PASS
      - name: Boot actual Linux EFI-stub kernel and initramfs through HFSPLUS.so
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            cpio busybox-static dosfstools gdisk mtools qemu-system-x86 ovmf
          kernel_package=$(apt-cache depends linux-image-generic |
            awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          test -n "$kernel_package"
          release=${kernel_package#linux-image-}
          (cd "$RUNNER_TEMP" && apt-get download "linux-image-unsigned-$release")
          dpkg-deb -x "$RUNNER_TEMP"/linux-image-unsigned-*.deb "$RUNNER_TEMP/kernel"
          kernel="$RUNNER_TEMP/kernel/boot/vmlinuz-$release"
          test -s "$kernel"
          boot="$RUNNER_TEMP/boot/usr/lib/infiltrator-boot/EFI/BOOT/BOOTX64.EFI"
          module="$RUNNER_TEMP/install/System/Filesystems/HFSPLUS.so"
          bash tests/firmware-hfsplus.sh "$boot" "$module" "$kernel" \
            "$RUNNER_TEMP/hfsplus-boot"
          bash tests/firmware-hfsplus.sh "$boot" "$module" "$kernel" \
            "$RUNNER_TEMP/hfsplus-corrupt" bad-superblock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hfsplus-ovmf-serial
          path: '**/serial.log'
          if-no-files-found: warn
